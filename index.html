<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reader</title>
    <meta name="description" content="A calm PDF reader in your browser. Highlight, take notes, pick up where you left off. Your files never leave your device." />
    <meta name="theme-color" content="#f6f4ef" />

    <!-- Link previews. Crawlers need absolute image URLs: once deployed, prefix og:image and twitter:image with the site's origin. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Reader" />
    <meta property="og:title" content="Reader: read slowly, keep what matters" />
    <meta property="og:description" content="A calm PDF reader in your browser. Highlight, take notes, pick up where you left off." />
    <meta property="og:image" content="/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Reader: Read slowly. Keep what matters. A page with highlighted lines and a note." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Reader: read slowly, keep what matters" />
    <meta name="twitter:description" content="A calm PDF reader in your browser. Highlight, take notes, pick up where you left off." />
    <meta name="twitter:image" content="/og.png" />
    <script>
      // Set the theme before first paint so dark mode never flashes light. theme.ts keeps it in sync after.
      try {
        var t = JSON.parse(localStorage.getItem('reader:theme') || '"system"')
        if (t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches))
          document.documentElement.classList.add('dark')
      } catch (e) {}
    </script>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/icon-192.png" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
